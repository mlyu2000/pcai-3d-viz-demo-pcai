apiVersion: v1
kind: ConfigMap
metadata:
  name: pcai-3d-viz-registration
  labels:
    hpe-ezua/app: pcai-3d-viz
    hpe-ezua/component: app
    hpe-ezua/type: vendor-service
    app.kubernetes.io/part-of: pcai-3d-viz-demo
data:
  app: "pcai-3d-viz"
  component: "pcai-3d-viz"
  appType: "AI"
  endpoint: "{{ .Values.ezua.virtualService.endpoint }}"
  description: "Astra 3D Visualization demo (PCAI: photo -> AI albedo/height maps -> Three.js -> Blender)"
